name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version
        run: |
          version="v$(jq -r .version manifest.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $version"
            exit 1
          fi

      - name: Build plugin archive
        run: |
          mkdir -p dist/mission-planner
          cp -r __init__.py api.py db.py planner.py rc.py wpml.py plugin.py manifest.json LICENSE README.md flypath_engine public templates dist/mission-planner/
          find dist -name "__pycache__" -type d -prune -exec rm -rf {} +
          cd dist
          zip -r -X mission-planner.zip mission-planner
          sha256sum mission-planner.zip > mission-planner.zip.sha256
          cat mission-planner.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/mission-planner.zip dist/mission-planner.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/mission-planner.zip dist/mission-planner.zip.sha256 --title "$GITHUB_REF_NAME" --generate-notes
          fi
